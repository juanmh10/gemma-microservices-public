name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.26.6'
          cache-dependency-path: |
            go.sum
            worker-b/go.sum
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: '1.14.3'
          terraform_wrapper: false
      - name: Install pinned audit and lint tools
        run: |
          go install github.com/zricethezav/gitleaks/v8@v8.30.1
          go install golang.org/x/vuln/cmd/govulncheck@v1.8.0
          python -m pip install ruff==0.15.21 pip-audit==2.10.1
          python -m venv .venv
          .venv/bin/python -m pip install -r worker-a/requirements.lock pytest==9.1.1
          curl --fail --silent --show-error --location --output tflint_linux_amd64.zip https://github.com/terraform-linters/tflint/releases/download/v0.64.0/tflint_linux_amd64.zip
          curl --fail --silent --show-error --location --output checksums.txt https://github.com/terraform-linters/tflint/releases/download/v0.64.0/checksums.txt
          python - <<'PY'
          import hashlib
          from pathlib import Path
          archive = Path('tflint_linux_amd64.zip')
          expected = next(line.split()[0] for line in Path('checksums.txt').read_text().splitlines() if line.split()[-1].lstrip('*') == archive.name)
          assert hashlib.sha256(archive.read_bytes()).hexdigest() == expected
          PY
          unzip -q tflint_linux_amd64.zip
          sudo install tflint /usr/local/bin/tflint
          rm tflint tflint_linux_amd64.zip checksums.txt
      - name: Audit, lint and validate
        run: make ci
      - name: Uncached pipeline race tests
        run: make test-pipeline
